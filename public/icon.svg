<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Subtle Octagram / Islamic Star Border -->
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.35" />
  <!-- Crescent Moon -->
  <path d="M296 118c-62 0-112 50-112 112s50 112 112 112c24 0 46-7.5 64-20.5-15 36.5-51 62.5-93 62.5-56 0-101-45-101-101s45-101 101-101c10 0 20 1.5 29 4.5z" fill="url(#gold)" opacity="0.22" />
  <!-- Dome / Mihrab Arch -->
  <path d="M136 392V236c0-74 60-128 120-148 60 20 120 74 120 148v156H136z" fill="#047857" fill-opacity="0.35" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round" />
  <!-- Top Finial Crescent -->
  <circle cx="256" cy="70" r="10" fill="url(#gold)" />
  <!-- Arabic Monogram من (Al-Manara) -->
  <text x="256" y="295" text-anchor="middle" fill="url(#gold)" font-family="serif" font-weight="bold" font-size="150">من</text>
  <!-- Subtitle bar -->
  <rect x="176" y="346" width="160" height="8" rx="4" fill="url(#gold)" opacity="0.85" />
</svg>
